name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.41.6
  API_BASE: https://rps.riecodes.com

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: flutter build apk --release --dart-define=API_BASE=$API_BASE
        working-directory: app
      - run: mv app/build/app/outputs/flutter-apk/app-release.apk RockPaperScissorLose.apk
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: RockPaperScissorLose.apk }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: flutter build macos --release --dart-define=API_BASE=$API_BASE
        working-directory: app
      - name: Package DMG (unsigned)
        run: |
          mkdir dmg
          cp -R "app/build/macos/Build/Products/Release/Rock Paper Scissor Lose.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Rock Paper Scissor Lose" -srcfolder dmg -ov -format UDZO RockPaperScissorLose.dmg
      - uses: actions/upload-artifact@v4
        with: { name: dmg, path: RockPaperScissorLose.dmg }

  release:
    needs: [android, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest-build' }}
          files: |
            RockPaperScissorLose.apk
            RockPaperScissorLose.dmg
